name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, build and tests
        run: npm run verify

      - name: Verify publish payload
        run: npm pack --dry-run

      - name: Generate patched js-yaml manifest and lockfile for review
        run: npm install js-yaml@4.3.2 --save-exact --package-lock-only --ignore-scripts

      - name: Verify patched production dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Upload patched manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: js-yaml-4.3.2-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
