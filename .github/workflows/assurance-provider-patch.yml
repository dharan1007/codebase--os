name: Apply provider reliability hardening

on:
  push:
    branches:
      - agent/production-assurance-v2
    paths:
      - .github/workflows/assurance-provider-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/production-assurance-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply provider reliability changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/types/index.ts')
          s = p.read_text()
          needle = "    modelOverride?: string;\n"
          replacement = "    modelOverride?: string;\n    timeoutMs?: number;\n    signal?: AbortSignal;\n"
          if 'timeoutMs?: number;' not in s:
              if needle not in s:
                  raise SystemExit('ModelRequest anchor not found')
              s = s.replace(needle, replacement, 1)
          p.write_text(s)

          Path('src/core/ai/providers/ProviderError.ts').write_text(r'''export type ProviderErrorCode =
    | 'AUTH_ERROR'
    | 'RATE_LIMIT'
    | 'MODEL_NOT_FOUND'
    | 'QUOTA_EXCEEDED'
    | 'SERVER_ERROR'
    | 'NETWORK_ERROR'
    | 'TIMEOUT'
    | 'CANCELLED'
    | 'CONTENT_FILTERED'
    | 'CONTEXT_TOO_LONG'
    | 'UNKNOWN';

export const RETRYABLE_CODES = new Set<ProviderErrorCode>([
    'RATE_LIMIT',
    'SERVER_ERROR',
    'NETWORK_ERROR',
    'TIMEOUT',
]);

export class ProviderError extends Error {
    constructor(
        public readonly code: ProviderErrorCode,
        message: string,
        public readonly providerName: string,
        public readonly statusCode?: number,
        public readonly originalError?: unknown,
        public readonly retryAfterMs?: number,
    ) {
        super(message);
        this.name = 'ProviderError';
    }

    get isRetryable(): boolean {
        return RETRYABLE_CODES.has(this.code);
    }

    get isFatal(): boolean {
        return this.code === 'AUTH_ERROR' ||
            this.code === 'MODEL_NOT_FOUND' ||
            this.code === 'QUOTA_EXCEEDED';
    }
}

function retryAfterMs(err: any): number | undefined {
    const direct = Number(err?.retryAfterMs);
    if (Number.isFinite(direct) && direct >= 0) return direct;

    const seconds = Number(err?.retryAfter);
    if (Number.isFinite(seconds) && seconds >= 0) return seconds * 1000;

    const raw = err?.headers?.get?.('retry-after') ?? err?.response?.headers?.get?.('retry-after');
    if (raw == null) return undefined;
    const numeric = Number(raw);
    if (Number.isFinite(numeric) && numeric >= 0) return numeric * 1000;
    const date = Date.parse(String(raw));
    return Number.isFinite(date) ? Math.max(0, date - Date.now()) : undefined;
}

export function classifyProviderError(err: unknown, providerName: string): ProviderError {
    if (err instanceof ProviderError) return err;

    const raw = err as any;
    const message = String(raw?.message ?? err);
    const msg = message.toLowerCase();
    const status: number | undefined = raw?.status ?? raw?.statusCode ?? raw?.response?.status;
    const providerCode = String(raw?.code ?? raw?.error?.code ?? '').toLowerCase();
    const retryAfter = retryAfterMs(raw);

    if (
        providerCode === 'insufficient_quota' ||
        msg.includes('exceeded your current quota') ||
        msg.includes('insufficient quota') ||
        msg.includes('billing quota') ||
        msg.includes('billing limit') ||
        msg.includes('payment required')
    ) {
        return new ProviderError('QUOTA_EXCEEDED', `Billing quota exceeded for ${providerName}.`, providerName, status, err);
    }
    if (status === 401 || status === 403) {
        return new ProviderError('AUTH_ERROR', `Authentication failed for ${providerName}. Check your API key.`, providerName, status, err);
    }
    if (status === 402) {
        return new ProviderError('QUOTA_EXCEEDED', `Billing quota exceeded for ${providerName}.`, providerName, status, err);
    }
    if (status === 404) {
        return new ProviderError('MODEL_NOT_FOUND', `Model not found on ${providerName}. Check model name in config.`, providerName, status, err);
    }
    if (status === 429) {
        return new ProviderError('RATE_LIMIT', `Rate limit hit on ${providerName}.`, providerName, status, err, retryAfter);
    }
    if (status !== undefined && status >= 500) {
        return new ProviderError('SERVER_ERROR', `${providerName} server error (HTTP ${status}).`, providerName, status, err);
    }
    if (raw?.name === 'AbortError' || providerCode === 'abort_err' || msg.includes('aborted')) {
        return new ProviderError('CANCELLED', `Request cancelled for ${providerName}.`, providerName, status, err);
    }
    if (msg.includes('timed out') || msg.includes('timeout') || msg.includes('etimedout')) {
        return new ProviderError('TIMEOUT', `Request timed out for ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('invalid api key') || msg.includes('incorrect api key') ||
        msg.includes('authentication') || msg.includes('unauthorized') ||
        msg.includes('permission denied') || msg.includes('api key')
    ) {
        return new ProviderError('AUTH_ERROR', `Authentication failed for ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('billing') || msg.includes('payment') || msg.includes('subscription') ||
        msg.includes('current quota') || msg.includes('quota exceeded')
    ) {
        return new ProviderError('QUOTA_EXCEEDED', `Billing quota exceeded for ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('429') || msg.includes('rate limit') || msg.includes('too many requests') ||
        msg.includes('requests per minute')
    ) {
        return new ProviderError('RATE_LIMIT', `Rate limit hit on ${providerName}.`, providerName, status, err, retryAfter);
    }
    if (
        msg.includes('model not found') || msg.includes('no such model') ||
        msg.includes('does not exist') || msg.includes('invalid model')
    ) {
        return new ProviderError('MODEL_NOT_FOUND', `Model not found on ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('context length') || msg.includes('too long') || msg.includes('token limit') ||
        msg.includes('max tokens') || msg.includes('context window')
    ) {
        return new ProviderError('CONTEXT_TOO_LONG', `Context too long for ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('content policy') || msg.includes('safety') || msg.includes('filtered') ||
        msg.includes('blocked') || msg.includes('harmful')
    ) {
        return new ProviderError('CONTENT_FILTERED', `Content filtered by ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('econnrefused') || msg.includes('enotfound') ||
        msg.includes('network') || msg.includes('fetch failed') || msg.includes('connection')
    ) {
        return new ProviderError('NETWORK_ERROR', `Network error reaching ${providerName}.`, providerName, status, err);
    }
    if (
        msg.includes('500') || msg.includes('502') || msg.includes('503') ||
        msg.includes('overloaded') || msg.includes('service unavailable') ||
        msg.includes('internal server error')
    ) {
        return new ProviderError('SERVER_ERROR', `${providerName} server error.`, providerName, status, err);
    }

    return new ProviderError('UNKNOWN', `Unexpected error from ${providerName}: ${message}`, providerName, status, err);
}
''')

          Path('src/core/orchestrator/ProviderHealthTracker.ts').write_text(r'''import { logger } from '../../utils/logger.js';
import type { AIProviderKind } from '../../types/index.js';

export type ProviderStatus = 'HEALTHY' | 'DEGRADED' | 'CIRCUIT_BROKEN';

interface ProviderStats {
    provider: AIProviderKind;
    model?: string;
    status: ProviderStatus;
    consecutiveFailures: number;
    lastErrorAt?: number;
    cooldownUntil?: number;
    successCount: number;
    errorCount: number;
}

export class ProviderHealthTracker {
    private static instance: ProviderHealthTracker;
    private stats = new Map<string, ProviderStats>();

    constructor() {}

    static getInstance(): ProviderHealthTracker {
        if (!ProviderHealthTracker.instance) ProviderHealthTracker.instance = new ProviderHealthTracker();
        return ProviderHealthTracker.instance;
    }

    static createIsolated(): ProviderHealthTracker {
        return new ProviderHealthTracker();
    }

    reportSuccess(provider: AIProviderKind, model?: string): void {
        const stats = this.getOrCreate(provider, model);
        stats.successCount++;
        stats.consecutiveFailures = 0;
        stats.status = 'HEALTHY';
        stats.cooldownUntil = undefined;
    }

    reportFailure(provider: AIProviderKind, error: any, model?: string): void {
        const stats = this.getOrCreate(provider, model);
        stats.errorCount++;
        stats.consecutiveFailures++;
        stats.lastErrorAt = Date.now();

        const code = String(error?.code ?? '');
        const message = String(error?.message ?? error).toLowerCase();
        const rateLimited = code === 'RATE_LIMIT' || message.includes('rate limit') || message.includes('429') || message.includes('too many requests');

        if (rateLimited) {
            const explicit = Number(error?.retryAfterMs);
            const fallback = 15_000 * Math.pow(3, Math.min(stats.consecutiveFailures - 1, 2));
            const delay = Number.isFinite(explicit) && explicit >= 0 ? explicit : fallback;
            stats.cooldownUntil = Date.now() + delay;
            stats.status = stats.consecutiveFailures >= 3 ? 'CIRCUIT_BROKEN' : 'DEGRADED';
            logger.warn('Provider rate limited', { provider, model, delay, status: stats.status });
            return;
        }

        if (stats.consecutiveFailures >= 2) {
            stats.status = 'DEGRADED';
            stats.cooldownUntil = Date.now() + 30_000;
        }
    }

    isHealthy(provider: AIProviderKind, model?: string): boolean {
        const global = this.stats.get(this.key(provider));
        if (global && !this.isEntryHealthy(global)) return false;
        if (!model) return true;
        const specific = this.stats.get(this.key(provider, model));
        return specific ? this.isEntryHealthy(specific) : true;
    }

    getWeight(provider: AIProviderKind, model?: string): number {
        if (!this.isHealthy(provider, model)) return 0;
        const stats = this.stats.get(this.key(provider, model)) ?? this.stats.get(this.key(provider));
        if (!stats) return 1;
        const total = stats.successCount + stats.errorCount;
        const successRate = total > 0 ? stats.successCount / total : 1;
        return Math.max(0.1, successRate - stats.consecutiveFailures * 0.2);
    }

    getSummary() {
        return Array.from(this.stats.values()).map(stats => {
            this.refreshCooldown(stats);
            return {
                provider: stats.provider,
                model: stats.model,
                status: stats.status,
                successRate: stats.successCount / (stats.successCount + stats.errorCount || 1),
                cooldownRemaining: stats.cooldownUntil ? Math.max(0, stats.cooldownUntil - Date.now()) : 0,
            };
        });
    }

    private isEntryHealthy(stats: ProviderStats): boolean {
        this.refreshCooldown(stats);
        if (stats.cooldownUntil && Date.now() < stats.cooldownUntil) return false;
        return stats.status !== 'CIRCUIT_BROKEN';
    }

    private refreshCooldown(stats: ProviderStats): void {
        if (!stats.cooldownUntil || Date.now() < stats.cooldownUntil) return;
        stats.cooldownUntil = undefined;
        if (stats.status === 'CIRCUIT_BROKEN') stats.status = 'DEGRADED';
    }

    private key(provider: AIProviderKind, model?: string): string {
        return `${provider}\u0000${model ?? '*'}`;
    }

    private getOrCreate(provider: AIProviderKind, model?: string): ProviderStats {
        const key = this.key(provider, model);
        let stats = this.stats.get(key);
        if (!stats) {
            stats = { provider, model, status: 'HEALTHY', consecutiveFailures: 0, successCount: 0, errorCount: 0 };
            this.stats.set(key, stats);
        }
        return stats;
    }
}
''')

          Path('src/core/orchestrator/TrafficController.ts').write_text(r'''import { EventEmitter } from 'events';
import crypto from 'crypto';
import { logger } from '../../utils/logger.js';
import type { AIProviderKind, ModelRequest, ModelResponse } from '../../types/index.js';
import { ProviderError, classifyProviderError } from '../ai/providers/ProviderError.js';
import { ProviderHealthTracker } from './ProviderHealthTracker.js';

const SYSTEM_CONFIG = {
    MIN_DISPATCH_INTERVAL_MS: 150,
    MAX_CONCURRENCY: 4,
    MAX_PAYLOAD_TOKENS: 120_000,
    MAX_PROVIDER_ROUNDS: 3,
    BASE_BACKOFF_MS: 750,
    CAP_BACKOFF_MS: 15_000,
    MAX_IN_FLIGHT_TOKENS: 160_000,
    REQUEST_DEADLINE_MS: 180_000,
};

export interface AIRequest {
    id: string;
    requestDetails: ModelRequest;
    providerSequence: AIProviderKind[];
    providerIndex: number;
    round: number;
    estimatedTokens: number;
    enqueuedAt: number;
    deadlineAt: number;
    fatalProviders: Set<AIProviderKind>;
    lastError?: string;
    resolve: (value: ModelResponse) => void;
    reject: (reason: Error) => void;
}

export class TokenEstimator {
    static estimate(text: string): number {
        return text ? Math.ceil(text.length / 3.5) : 0;
    }
}

export class RetryHandler {
    static calculateDelay(round: number, retryAfterMs?: number): number {
        if (Number.isFinite(retryAfterMs) && retryAfterMs! >= 0) return retryAfterMs!;
        const cap = Math.min(SYSTEM_CONFIG.CAP_BACKOFF_MS, SYSTEM_CONFIG.BASE_BACKOFF_MS * Math.pow(2, round));
        return Math.floor(cap / 2 + Math.random() * cap / 2);
    }
}

export class AdaptiveConcurrencyManager {
    public limit = 1;
    recordSuccess(): void { if (this.limit < SYSTEM_CONFIG.MAX_CONCURRENCY) this.limit++; }
    recordOverload(): void { this.limit = Math.max(1, Math.floor(this.limit / 2)); }
}

export class TrafficController extends EventEmitter {
    private static instance: TrafficController;
    private queue: AIRequest[] = [];
    private inFlightRequests = new Map<string, AIRequest>();
    private inFlightTokens = 0;
    private concurrencyManager = new AdaptiveConcurrencyManager();
    private lastDispatchTime = 0;
    private isProcessorRunning = false;
    private networkExecutor?: (req: AIRequest, provider: AIProviderKind) => Promise<ModelResponse>;

    constructor(private healthTracker: ProviderHealthTracker = ProviderHealthTracker.getInstance()) {
        super();
    }

    static getInstance(): TrafficController {
        if (!TrafficController.instance) TrafficController.instance = new TrafficController();
        return TrafficController.instance;
    }

    static createIsolated(): TrafficController {
        return new TrafficController(ProviderHealthTracker.createIsolated());
    }

    setNetworkExecutor(executor: (req: AIRequest, provider: AIProviderKind) => Promise<ModelResponse>): void {
        this.networkExecutor = executor;
    }

    async schedule(requestDetails: ModelRequest, providerSequence: AIProviderKind[]): Promise<ModelResponse> {
        const sequence = [...new Set(providerSequence)];
        if (sequence.length === 0) throw new Error('NO_PROVIDER_AVAILABLE: no configured/healthy provider candidates were supplied.');
        if (!this.networkExecutor) throw new Error('ORCHESTRATOR_NOT_READY: network executor is not configured.');

        const estimatedTokens = TokenEstimator.estimate(this.contextText(requestDetails.context));
        if (estimatedTokens > SYSTEM_CONFIG.MAX_PAYLOAD_TOKENS) {
            throw new Error(`PAYLOAD_TOO_LARGE: estimated ${estimatedTokens} tokens exceeds scheduler limit ${SYSTEM_CONFIG.MAX_PAYLOAD_TOKENS}.`);
        }

        const timeoutMs = this.positiveInt(requestDetails.timeoutMs, SYSTEM_CONFIG.REQUEST_DEADLINE_MS);
        const now = Date.now();
        return new Promise<ModelResponse>((resolve, reject) => {
            this.queue.push({
                id: crypto.randomUUID(),
                requestDetails,
                providerSequence: sequence,
                providerIndex: 0,
                round: 0,
                estimatedTokens,
                enqueuedAt: now,
                deadlineAt: now + timeoutMs,
                fatalProviders: new Set(),
                resolve,
                reject,
            });
            void this.startProcessor();
        });
    }

    private async startProcessor(): Promise<void> {
        if (this.isProcessorRunning) return;
        this.isProcessorRunning = true;
        try {
            while (this.queue.length > 0 || this.inFlightRequests.size > 0) {
                this.rejectExpired();
                this.tryDispatch();
                await new Promise(resolve => setTimeout(resolve, 20));
            }
        } finally {
            this.isProcessorRunning = false;
            if (this.queue.length > 0) void this.startProcessor();
        }
    }

    private tryDispatch(): void {
        if (this.queue.length === 0 || !this.networkExecutor) return;
        if (this.inFlightRequests.size >= this.concurrencyManager.limit) return;

        const request = this.queue[0]!;
        if (request.requestDetails.signal?.aborted) {
            this.queue.shift();
            request.reject(new Error('PROVIDER_CANCELLED: request was cancelled before dispatch.'));
            return;
        }
        if (Date.now() >= request.deadlineAt) {
            this.queue.shift();
            request.reject(this.deadlineError(request));
            return;
        }
        if (this.inFlightRequests.size > 0 && this.inFlightTokens + request.estimatedTokens > SYSTEM_CONFIG.MAX_IN_FLIGHT_TOKENS) return;
        if (Date.now() - this.lastDispatchTime < SYSTEM_CONFIG.MIN_DISPATCH_INTERVAL_MS) return;

        const selected = this.selectHealthyProvider(request);
        if (!selected) return;

        this.queue.shift();
        request.providerIndex = selected.index;
        this.lastDispatchTime = Date.now();
        this.inFlightRequests.set(request.id, request);
        this.inFlightTokens += request.estimatedTokens;
        void this.executeNetworkCall(request, selected.provider);
    }

    private selectHealthyProvider(request: AIRequest): { provider: AIProviderKind; index: number } | null {
        const model = request.requestDetails.modelOverride;
        for (let offset = 0; offset < request.providerSequence.length; offset++) {
            const index = (request.providerIndex + offset) % request.providerSequence.length;
            const provider = request.providerSequence[index]!;
            if (request.fatalProviders.has(provider)) continue;
            if (this.healthTracker.isHealthy(provider, model)) return { provider, index };
        }
        return null;
    }

    private async executeNetworkCall(req: AIRequest, provider: AIProviderKind): Promise<void> {
        const remaining = req.deadlineAt - Date.now();
        if (remaining <= 0) {
            this.finalizeRequest(req);
            req.reject(this.deadlineError(req));
            return;
        }

        const controller = new AbortController();
        const sourceSignal = req.requestDetails.signal;
        let sourceAbort: (() => void) | undefined;
        if (sourceSignal) {
            if (sourceSignal.aborted) controller.abort(sourceSignal.reason);
            else {
                sourceAbort = () => controller.abort(sourceSignal.reason);
                sourceSignal.addEventListener('abort', sourceAbort, { once: true });
            }
        }

        let deadlineTriggered = false;
        let timeout: ReturnType<typeof setTimeout> | undefined;
        const timeoutPromise = new Promise<never>((_, reject) => {
            timeout = setTimeout(() => {
                deadlineTriggered = true;
                controller.abort(new Error('provider deadline exceeded'));
                reject(this.deadlineError(req));
            }, remaining);
        });
        const executionRequest: AIRequest = {
            ...req,
            requestDetails: { ...req.requestDetails, signal: controller.signal },
        };

        try {
            const response = await Promise.race([
                this.networkExecutor!(executionRequest, provider),
                timeoutPromise,
            ]);
            this.healthTracker.reportSuccess(provider, req.requestDetails.modelOverride ?? response.model);
            this.concurrencyManager.recordSuccess();
            this.finalizeRequest(req);
            req.resolve(response);
        } catch (error: any) {
            if (deadlineTriggered || Date.now() >= req.deadlineAt) {
                this.finalizeRequest(req);
                req.reject(this.deadlineError(req));
            } else if (sourceSignal?.aborted) {
                this.finalizeRequest(req);
                req.reject(new Error('PROVIDER_CANCELLED: request was cancelled.'));
            } else {
                this.handleFailure(req, provider, error);
            }
        } finally {
            if (timeout) clearTimeout(timeout);
            if (sourceSignal && sourceAbort) sourceSignal.removeEventListener('abort', sourceAbort);
        }
    }

    private handleFailure(req: AIRequest, provider: AIProviderKind, error: any): void {
        this.finalizeRequest(req);
        const classified = error instanceof ProviderError ? error : classifyProviderError(error, provider);
        const model = req.requestDetails.modelOverride;
        this.healthTracker.reportFailure(provider, classified, model);
        req.lastError = `${classified.code}: ${classified.message}`;

        if (classified.code === 'RATE_LIMIT') this.concurrencyManager.recordOverload();
        if (classified.isFatal) req.fatalProviders.add(provider);

        req.providerIndex++;
        if (req.providerIndex >= req.providerSequence.length) {
            req.providerIndex = 0;
            req.round++;
        }

        if (req.fatalProviders.size >= req.providerSequence.length || req.round >= SYSTEM_CONFIG.MAX_PROVIDER_ROUNDS) {
            req.reject(this.exhaustedError(req));
            return;
        }
        if (Date.now() >= req.deadlineAt) {
            req.reject(this.deadlineError(req));
            return;
        }

        const delay = classified.isFatal ? 0 : RetryHandler.calculateDelay(req.round, classified.retryAfterMs);
        const remaining = Math.max(0, req.deadlineAt - Date.now());
        logger.warn('Provider request failed; scheduling next candidate', {
            provider,
            code: classified.code,
            nextIndex: req.providerIndex,
            round: req.round,
            delay: Math.min(delay, remaining),
        });
        setTimeout(() => {
            if (Date.now() >= req.deadlineAt) {
                req.reject(this.deadlineError(req));
                return;
            }
            this.queue.unshift(req);
            void this.startProcessor();
        }, Math.min(delay, remaining));
    }

    private rejectExpired(): void {
        const now = Date.now();
        const retained: AIRequest[] = [];
        for (const request of this.queue) {
            if (request.requestDetails.signal?.aborted) request.reject(new Error('PROVIDER_CANCELLED: request was cancelled.'));
            else if (now >= request.deadlineAt) request.reject(this.deadlineError(request));
            else retained.push(request);
        }
        this.queue = retained;
    }

    private deadlineError(req: AIRequest): Error {
        const timeoutMs = Math.max(0, req.deadlineAt - req.enqueuedAt);
        return new Error(`PROVIDER_TIMEOUT: request exceeded ${timeoutMs}ms without a usable provider.${req.lastError ? ` Last error: ${req.lastError}` : ''}`);
    }

    private exhaustedError(req: AIRequest): Error {
        return new Error(`PROVIDER_EXHAUSTED: ${req.providerSequence.join(', ')} exhausted. Last error: ${req.lastError ?? 'unknown'}`);
    }

    private finalizeRequest(req: AIRequest): void {
        if (this.inFlightRequests.delete(req.id)) this.inFlightTokens = Math.max(0, this.inFlightTokens - req.estimatedTokens);
    }

    private contextText(context: unknown): string {
        if (typeof context === 'string') return context;
        if (Array.isArray(context)) {
            return context.map(item => item && typeof item === 'object' && 'content' in item ? String((item as any).content ?? '') : String(item ?? '')).join('\n');
        }
        return String(context ?? '');
    }

    private positiveInt(value: number | undefined, fallback: number): number {
        return Number.isFinite(value) && value! > 0 ? Math.floor(value!) : fallback;
    }

    getInternalMetrics() {
        return {
            queueDepth: this.queue.length,
            inFlightCount: this.inFlightRequests.size,
            inFlightTokens: this.inFlightTokens,
            concurrencyLimit: this.concurrencyManager.limit,
        };
    }
}
''')

