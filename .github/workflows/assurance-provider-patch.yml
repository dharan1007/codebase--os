          s = p.read_text()
          old = """                const msg = String(err?.message ?? err).toLowerCase();\n\n                // Only retry on rate limits and transient server errors\n                const isRetryable =\n                    msg.includes('429') ||\n                    msg.includes('rate limit') ||\n                    msg.includes('too many requests') ||\n                    msg.includes('503') ||\n                    msg.includes('502') ||\n                    msg.includes('service unavailable') ||\n                    msg.includes('overloaded');\n\n                if (!isRetryable) {\n                    logger.debug(`[RateLimiter.withRetry] Non-retryable error for \"${label}\": ${err.message}`);\n                    throw err;\n                }\n\n                // Exponential backoff with jitter to avoid thundering herd\n                const jitter = Math.random() * 500;\n                const delay = baseDelayMs * Math.pow(2, attempt) + jitter;\n"""
          new = """                const msg = String(err?.message ?? err).toLowerCase();\n                const typedRetryable = typeof err?.isRetryable === 'boolean' ? err.isRetryable : undefined;\n                const isRetryable = typedRetryable ?? (\n                    msg.includes('429') ||\n                    msg.includes('rate limit') ||\n                    msg.includes('too many requests') ||\n                    msg.includes('503') ||\n                    msg.includes('502') ||\n                    msg.includes('service unavailable') ||\n                    msg.includes('overloaded')\n                );\n\n                if (!isRetryable) {\n                    logger.debug(`[RateLimiter.withRetry] Non-retryable error for \"${label}\": ${err.message}`);\n                    throw err;\n                }\n\n                const explicitDelay = Number(err?.retryAfterMs);\n                const jitter = Math.random() * 500;\n                const delay = Number.isFinite(explicitDelay) && explicitDelay >= 0\n                    ? explicitDelay\n                    : baseDelayMs * Math.pow(2, attempt) + jitter;\n"""
          if old not in s:
              raise SystemExit('RateLimiter retry block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
