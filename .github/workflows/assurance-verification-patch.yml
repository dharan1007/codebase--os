name: Apply verification assurance patch

on:
  push:
    branches:
      - agent/production-assurance-v2
    paths:
      - .github/workflows/assurance-verification-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/production-assurance-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply kernel changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/core/verification/VerificationEngine.ts')
          s = p.read_text()
          s = s.replace("import { parseBabel, detectLanguage } from '../../utils/ast.js';", "import { parseBabel, detectLanguage } from '../../utils/ast.js';\nimport { WorkspaceFingerprint } from './WorkspaceFingerprint.js';")
          s = s.replace("    summary: string;\n}", "    summary: string;\n    workspaceFingerprint: string;\n}")
          s = s.replace("    async verify(changedFiles: string[]): Promise<VerificationReport> {\n        const normalizedFiles", "    async verify(changedFiles: string[]): Promise<VerificationReport> {\n        const workspaceFingerprint = WorkspaceFingerprint.capture(this.rootDir);\n        const normalizedFiles")
          s = s.replace("if (checks.some(check => !check.success)) return this.finish(checks);", "if (checks.some(check => !check.success)) return this.finish(checks, workspaceFingerprint);")
          s = s.replace("            return this.finish(checks);\n        }\n\n        for (const command of commands)", "            return this.finish(checks, workspaceFingerprint);\n        }\n\n        for (const command of commands)")
          old = """        for (const command of commands) {\n            const start = Date.now();\n            const result = await this.sandbox.execute(command);\n            checks.push(this.commandCheck(command, result, Date.now() - start));\n            if (!result.success) break;\n        }\n        return this.finish(checks);\n    }\n"""
          new = """        for (const command of commands) {\n            const start = Date.now();\n            const result = await this.sandbox.execute(command);\n            checks.push(this.commandCheck(command, result, Date.now() - start));\n            if (!result.success) break;\n        }\n\n        const currentFingerprint = WorkspaceFingerprint.capture(this.rootDir);\n        if (currentFingerprint !== workspaceFingerprint) {\n            checks.push({\n                name: 'workspace-freshness',\n                success: false,\n                durationMs: 0,\n                output: '',\n                error: 'Repository state changed while verification gates were running. Evidence is stale.',\n            });\n        }\n        return this.finish(checks, workspaceFingerprint);\n    }\n\n    isReportFresh(report: VerificationReport): boolean {\n        return report.success && WorkspaceFingerprint.capture(this.rootDir) === report.workspaceFingerprint;\n    }\n"""
          if old not in s:
              raise SystemExit('VerificationEngine command block not found')
          s = s.replace(old, new)
          old_finish = """    private finish(checks: VerificationCheck[]): VerificationReport {\n        const failures = checks.filter(check => !check.success);\n        const success = checks.length > 0 && failures.length === 0;\n        const commands = checks.flatMap(check => check.command ? [check.command] : []);\n        const summary = success\n            ? `Verification passed: ${checks.length} check(s), ${commands.length} command gate(s).`\n            : `Verification failed: ${failures.length} of ${checks.length} check(s) failed.`;\n        return { success, checks, commands, summary };\n    }\n"""
          new_finish = """    private finish(checks: VerificationCheck[], workspaceFingerprint: string): VerificationReport {\n        const failures = checks.filter(check => !check.success);\n        const success = checks.length > 0 && failures.length === 0;\n        const commands = checks.flatMap(check => check.command ? [check.command] : []);\n        const summary = success\n            ? `Verification passed: ${checks.length} check(s), ${commands.length} command gate(s).`\n            : `Verification failed: ${failures.length} of ${checks.length} check(s) failed.`;\n        return { success, checks, commands, summary, workspaceFingerprint };\n    }\n"""
          if old_finish not in s:
              raise SystemExit('VerificationEngine finish block not found')
          s = s.replace(old_finish, new_finish)
          p.write_text(s)

          p = Path('src/core/ai/AgentRuntime.ts')
          s = p.read_text()
          needle = """                        this.lastVerificationStep = stepCount;\n                    }\n                    completed = true;\n"""
          replacement = """                        if (!this.verificationEngine.isReportFresh(verification)) {\n                            messages.push({\n                                role: 'user',\n                                content: '[COMPLETION REJECTED]: Repository state changed after verification. Run verification again against the current workspace.',\n                            });\n                            this.saveCheckpoint(messages);\n                            continue;\n                        }\n                        this.lastVerificationStep = stepCount;\n                    }\n                    completed = true;\n"""
          if needle not in s:
              raise SystemExit('AgentRuntime verification acceptance block not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          p = Path('src/core/sandbox/SandboxManager.ts')
          s = p.read_text()
          if "'node:20-bookworm-slim'" not in s:
              raise SystemExit('Sandbox Node 20 default not found')
          p.write_text(s.replace("'node:20-bookworm-slim'", "'node:22-bookworm-slim'", 1))
          PY
      - name: Verify focused assurance tests
        run: |
          npm ci
          npm run build
          node --test tests/production-assurance.test.cjs
      - name: Commit verified patch
        run: |
          rm .github/workflows/assurance-verification-patch.yml
          git config user.name "codebase-os-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/verification/VerificationEngine.ts src/core/ai/AgentRuntime.ts src/core/sandbox/SandboxManager.ts .github/workflows/assurance-verification-patch.yml
          git commit -m "fix: bind completion to fresh verification evidence"
          git push origin HEAD:agent/production-assurance-v2
