name: Apply database assurance patch

on:
  push:
    branches:
      - agent/production-assurance-v2
    paths:
      - .github/workflows/assurance-db-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/production-assurance-v2
      - name: Patch database durability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/storage/Database.ts')
          s = p.read_text()
          s = s.replace("this.db.pragma('synchronous = NORMAL');", "this.db.pragma('synchronous = FULL');")
          anchor = "          CREATE TABLE IF NOT EXISTS graph_nodes ("
          schema = """          CREATE TABLE IF NOT EXISTS schema_migrations (\n            version INTEGER PRIMARY KEY,\n            applied_at INTEGER NOT NULL\n          );\n\n"""
          if 'CREATE TABLE IF NOT EXISTS schema_migrations' not in s:
              s = s.replace(anchor, schema + anchor)
          marker = "        this.ensureColumn('change_records', 'source_path', 'TEXT');\n"
          insert = marker + "        this.db.prepare('INSERT OR IGNORE INTO schema_migrations (version, applied_at) VALUES (?, ?)').run(1, Date.now());\n"
          if 'INSERT OR IGNORE INTO schema_migrations' not in s:
              s = s.replace(marker, insert)
          marker2 = "    prepare(sql: string): any {\n"
          quick = """    quickCheck(): { ok: boolean; message: string } {\n        if (this.closed) throw new Error('Database is closed.');\n        const result = this.db.pragma('quick_check', { simple: true });\n        const message = String(result ?? 'unknown');\n        return { ok: message.toLowerCase() === 'ok', message };\n    }\n\n"""
          if 'quickCheck():' not in s:
              s = s.replace(marker2, quick + marker2)
          init = "        this.initialize();\n"
          check = init + "        const integrity = this.quickCheck();\n        if (!integrity.ok) {\n            this.db.close();\n            this.closed = true;\n            throw new Error(`Codebase OS database integrity check failed: ${integrity.message}`);\n        }\n"
          if 'const integrity = this.quickCheck();' not in s:
              s = s.replace(init, check, 1)
          p.write_text(s)
          PY
          rm .github/workflows/assurance-db-patch.yml
      - name: Commit patch
        run: |
          git config user.name "codebase-os-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/storage/Database.ts .github/workflows/assurance-db-patch.yml
          git commit -m "fix: strengthen sqlite durability contract"
          git push origin HEAD:agent/production-assurance-v2
