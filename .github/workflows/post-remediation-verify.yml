name: Legacy post-remediation verification (disabled)

# Historical audit helper retained because the connected GitHub integration does not
# permit destructive deletion. It is intentionally manual-only and read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain deprecation
        run: |
          echo "This legacy audit workflow is disabled for release use."
          echo "Canonical release evidence is produced by CI and Security workflows."
