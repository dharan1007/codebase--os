name: Lockfile refresh

on:
  push:
    branches:
      - agent/production-hardening
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/production-hardening

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile from patched dependency constraints
        run: npm install --package-lock-only --ignore-scripts

      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(security): refresh audited dependency lockfile"
          git push origin HEAD:agent/production-hardening
